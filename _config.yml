# Keep GitHub Pages' default theme for the Jekyll-rendered root README.md page
# (the translated READMEs live in .github/, which Jekyll excludes);
# docs/ pages use the custom "doc" layout below.
theme: jekyll-theme-primer

defaults:
  - scope:
      path: "docs"
    values:
      layout: "doc"

# Repo tooling, not site content (tools/ holds the CI date-sync script and bold_check.py).
exclude:
  - tools/
